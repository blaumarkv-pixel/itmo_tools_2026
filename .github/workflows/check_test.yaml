name: CI - Tests on Tag

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      source_path:
        description: "Путь к исходнику (или glob)"
        required: false
        default: "Coffee"
      test_path:
        description: "Путь к тестам (или glob)"
        required: false
        default: "Coffee/test_coffe.py"
      min_tests_per_fn:
        description: "Минимум тестов на функцию"
        required: false
        default: "3"
      required_markers:
        description: "Обязательные pytest-маркеры (через запятую)"
        required: false
        default: ""
      strict:
        description: "Строгий режим (WARN тоже валит CI)"
        type: boolean
        default: false

env:
  # ---- Пути ----
  SOURCE_PATH: ${{ github.event.inputs.source_path || 'Coffee' }}
  TEST_PATH: ${{ github.event.inputs.test_path || 'Coffee/test_coffe.py' }}

  # ---- Пороги ----
  MIN_TESTS_PER_FN: ${{ github.event.inputs.min_tests_per_fn || '3' }}
  MIN_NEGATIVE_TESTS: "1"          # минимум негативных тестов на функцию с raise
  MIN_BOUNDARY_CATEGORIES: "2"     # сколько категорий граничных значений минимум
  REQUIRED_MARKERS: ${{ github.event.inputs.required_markers || '' }}

  # ---- Стили, которые считаем валидными ----
  RAISES_STYLES: "raises,assertRaises,assertRaisesRegex,assertRaisesRegexp,warns,assertWarns,assertWarnsRegex,fail,assertRaisesMessage"
  TYPE_CHECK_STYLES: "isinstance,assertIsInstance,assertNotIsInstance,type"
  RECEIPT_CHECK_STYLES: "regex,substring,snapshot,parametrize"

  # ---- Наборы исключений ----
  BASE_EXCEPTIONS: "TypeError,ValueError,KeyError,IndexError,AttributeError,ZeroDivisionError,AssertionError,StopIteration,OverflowError"
  TYPE_EXCEPTIONS: "TypeError,ValueError"

  # ---- Режим ----
  STRICT: ${{ github.event.inputs.strict || 'false' }}

jobs:
  analyze-tests:
    runs-on: ubuntu-latest
    outputs:
      report_ok: ${{ steps.report.outputs.ok }}
      report_text: ${{ steps.report.outputs.text }}
      tests_ok: ${{ steps.pytest.outputs.tests_ok }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov coverage

      - name: Locate test file
        id: locate_test
        run: |
          python - <<'EOF'
          import os
          from pathlib import Path

          candidates = []
          configured = os.environ.get("TEST_PATH", "")
          if configured:
              # прямой путь
              p = Path(configured)
              if p.exists():
                  candidates.append(p)
              else:
                  # как glob
                  candidates += list(Path(".").glob(configured))
          # стандартные конвенции
          for pattern in ("**/test_*.py", "**/*_test.py"):
              candidates += [x for x in Path(".").glob(pattern)
                             if ".venv" not in str(x) and "site-packages" not in str(x)]

          # убрать дубли
          seen, unique = set(), []
          for c in candidates:
              r = c.resolve()
              if r not in seen:
                  seen.add(r)
                  unique.append(c)

          if not unique:
              print("::error::Не найден файл с тестами")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("test_files=\n")
              raise SystemExit(0)

          print("Найдены тестовые файлы:")
          for c in unique:
              print(f"  - {c}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("test_files=" + " ".join(str(c) for c in unique) + "\n")
          EOF

      - name: Locate source files
        id: locate_source
        run: |
          python - <<'EOF'
          import os
          from pathlib import Path

          configured = os.environ.get("SOURCE_PATH", "")
          test_files = set(os.environ.get("TEST_FILES", "").split())

          candidates = []
          if configured:
              p = Path(configured)
              if p.is_file():
                  candidates.append(p)
              elif p.is_dir():
                  candidates += list(p.glob("*.py"))
              else:
                  candidates += list(Path(".").glob(configured))

          # добавить из корня
          candidates += list(Path(".").glob("*.py"))

          # фильтр
          result = []
          seen = set()
          for c in candidates:
              if str(c) in test_files:
                  continue
              if c.name.startswith("test_") or c.name.endswith("_test.py"):
                  continue
              if c.name == "conftest.py":
                  continue
              if "site-packages" in str(c) or ".venv" in str(c):
                  continue
              r = c.resolve()
              if r in seen:
                  continue
              seen.add(r)
              result.append(c)

          if not result:
              print("::error::Не найден исходный файл")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("source_files=\n")
              raise SystemExit(0)

          print("Найдены исходные файлы:")
          for c in result:
              print(f"  - {c}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("source_files=" + " ".join(str(c) for c in result) + "\n")
          EOF
        env:
          TEST_FILES: ${{ steps.locate_test.outputs.test_files }}

      - name: Run tests with coverage (do not fail job here)
        id: pytest
        run: |
          set +e
          TESTS="${{ steps.locate_test.outputs.test_files }}"
          if [ -z "$TESTS" ]; then
            echo "Нет тестовых файлов — пропускаем"
            echo "tests_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          coverage run --branch -m pytest $TESTS -v
          PYTEST_EXIT=$?
          coverage report -m || true
          coverage json -o coverage.json || true
          if [ "$PYTEST_EXIT" -eq 0 ]; then
            echo "tests_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "tests_ok=false" >> "$GITHUB_OUTPUT"
          fi
          echo "pytest exit code: $PYTEST_EXIT"
          exit 0

      - name: Analyze coverage and tests (never fails)
        id: report
        run: |
          python - <<'EOF'
          import ast
          import json
          import os
          import re
          import sys
          from pathlib import Path

          # ---------- Настройки из env ----------
          TEST_FILES = [Path(p) for p in os.environ.get("TEST_FILES", "").split() if p]
          SOURCE_FILES = [Path(p) for p in os.environ.get("SOURCE_FILES", "").split() if p]

          MIN_TESTS_PER_FN = int(os.environ.get("MIN_TESTS_PER_FN", "3"))
          MIN_NEGATIVE_TESTS = int(os.environ.get("MIN_NEGATIVE_TESTS", "1"))
          MIN_BOUNDARY_CATEGORIES = int(os.environ.get("MIN_BOUNDARY_CATEGORIES", "2"))
          REQUIRED_MARKERS = [m.strip() for m in os.environ.get("REQUIRED_MARKERS", "").split(",") if m.strip()]
          STRICT = os.environ.get("STRICT", "false").lower() in ("true", "1", "yes")
          TESTS_OK = os.environ.get("TESTS_OK", "") == "true"

          RAISES_STYLES = set(os.environ.get(
              "RAISES_STYLES",
              "raises,assertRaises,assertRaisesRegex,assertRaisesRegexp,warns,assertWarns,assertWarnsRegex,fail"
          ).split(","))
          TYPE_CHECK_STYLES = set(os.environ.get(
              "TYPE_CHECK_STYLES",
              "isinstance,assertIsInstance,assertNotIsInstance,type"
          ).split(","))
          BASE_EXCEPTIONS = set(os.environ.get("BASE_EXCEPTIONS", "").split(","))
          TYPE_EXCEPTIONS = set(os.environ.get("TYPE_EXCEPTIONS", "TypeError,ValueError").split(","))
          RECEIPT_CHECK_STYLES = set(os.environ.get("RECEIPT_CHECK_STYLES", "").split(","))

          report = []
          problems = []
          warnings = []

          def add(section, status, details=""):
              report.append((section, status, details))
              if status == "FAIL":
                  problems.append(f"{section}: {details}")
              elif status == "WARN":
                  warnings.append(f"{section}: {details}")

          if not TEST_FILES:
              add("Поиск тестов", "FAIL", "тестовые файлы не найдены")
              # печатаем и выходим
              print("=" * 72)
              for s, st, d in report:
                  print(f"[{st}] {s} — {d}")
              print("=" * 72)
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("ok=false\n")
                  f.write("text<<REPORT_EOF\nОШИБКА: тестовые файлы не найдены\nREPORT_EOF\n")
              sys.exit(0)

          if not SOURCE_FILES:
              add("Поиск исходника", "FAIL", "исходные файлы не найдены")
              print("=" * 72)
              for s, st, d in report:
                  print(f"[{st}] {s} — {d}")
              print("=" * 72)
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("ok=false\n")
                  f.write("text<<REPORT_EOF\nОШИБКА: исходные файлы не найдены\nREPORT_EOF\n")
              sys.exit(0)

          # ---------- Парсинг ----------
          test_trees = {}
          test_source_text = ""
          for tf in TEST_FILES:
              txt = tf.read_text(encoding="utf-8")
              test_source_text += "\n" + txt
              test_trees[tf] = ast.parse(txt)

          src_trees = {}
          for sf in SOURCE_FILES:
              src_trees[sf] = ast.parse(sf.read_text(encoding="utf-8"))

          # все тестовые функции
          test_functions = []
          for tf, tree in test_trees.items():
              test_functions += [
                  n for n in ast.walk(tree)
                  if isinstance(n, ast.FunctionDef) and n.name.startswith("test_")
              ]

          # все функции исходника
          all_fn_nodes = []
          for sf, tree in src_trees.items():
              for n in ast.walk(tree):
                  if isinstance(n, ast.FunctionDef):
                      n._source_file = str(sf)
                      all_fn_nodes.append(n)
          fn_names = [n.name for n in all_fn_nodes]

          # кастомные исключения (наследники Exception)
          custom_exceptions = set()
          for tree in src_trees.values():
              for node in ast.walk(tree):
                  if isinstance(node, ast.ClassDef):
                      for base in node.bases:
                          if isinstance(base, ast.Name) and base.id in ("Exception", "BaseException"):
                              custom_exceptions.add(node.name)
                          elif isinstance(base, ast.Attribute) and base.attr in ("Exception", "BaseException"):
                              custom_exceptions.add(node.name)
          ALL_EXCEPTIONS = BASE_EXCEPTIONS | custom_exceptions

          # ---------- Помощники ----------
          def _get_callable_name(func):
              if isinstance(func, ast.Name):
                  return func.id
              if isinstance(func, ast.Attribute):
                  return func.attr
              return None

          def has_raises(node):
              """Есть ли вызов стиля pytest.raises/assertRaises/... в поддереве."""
              for sub in ast.walk(node):
                  if isinstance(sub, ast.Call):
                      name = _get_callable_name(sub.func)
                      if name and name in RAISES_STYLES:
                          return True
              return False

          def raises_targets(node):
              """Какие имена исключений явно указаны в raises-вызовах."""
              names = set()
              for sub in ast.walk(node):
                  if isinstance(sub, ast.Call):
                      name = _get_callable_name(sub.func)
                      if name and name in RAISES_STYLES:
                          for arg in sub.args:
                              if isinstance(arg, ast.Name):
                                  names.add(arg.id)
                              elif isinstance(arg, ast.Tuple):
                                  for el in arg.elts:
                                      if isinstance(el, ast.Name):
                                          names.add(el.id)
              return names

          def raises_checks_message(node):
              """Проверяется ли текст исключения (match=, regex/pattern)."""
              for sub in ast.walk(node):
                  if isinstance(sub, ast.Call):
                      name = _get_callable_name(sub.func)
                      if name in ("raises", "assertRaises"):
                          for kw in sub.keywords:
                              if kw.arg in ("match", "regex"):
                                  return True
                      if name in ("assertRaisesRegex", "assertRaisesRegexp", "assertWarnsRegex", "assertRaisesMessage"):
                          return True
              return False

          def has_type_check(node):
              """isinstance / assertIsInstance / type(x) is T."""
              for sub in ast.walk(node):
                  if isinstance(sub, ast.Call):
                      name = _get_callable_name(sub.func)
                      if name in TYPE_CHECK_STYLES:
                          return True
                  if isinstance(sub, ast.Compare):
                      left = sub.left
                      if isinstance(left, ast.Call) and _get_callable_name(left.func) == "type":
                          ops = [type(op).__name__ for op in sub.ops]
                          if any(op in ("Is", "IsNot", "Eq", "NotEq") for op in ops):
                              return True
              return False

          def has_assert(node):
              for sub in ast.walk(node):
                  if isinstance(sub, ast.Assert):
                      return True
                  if isinstance(sub, ast.Call):
                      name = _get_callable_name(sub.func)
                      if name and name.startswith("assert"):
                          return True
              return False

          def is_positive(node):
              """Позитивный = есть хотя бы один assert/assert_* ИЛИ вообще нет raises.
              Если есть и то, и другое — всё равно позитивный, потому что проверяет результат."""
              return has_assert(node) or not has_raises(node)

          def is_negative(node):
              return has_raises(node)

          def has_marker(node, marker_name):
              for dec in node.decorator_list:
                  if isinstance(dec, ast.Call):
                      name = _get_callable_name(dec.func)
                      if name == marker_name:
                          return True
                  elif isinstance(dec, ast.Attribute) and dec.attr == marker_name:
                      return True
                  elif isinstance(dec, ast.Name) and dec.id == marker_name:
                      return True
              return False

          def annotated_return_kind(fn_node):
              ret = fn_node.returns
              if ret is None:
                  return None
              if isinstance(ret, ast.Name):
                  return ret.id
              if isinstance(ret, ast.Subscript):
                  base = ret.value
                  if isinstance(base, ast.Name):
                      return base.id
                  return "container"
              if isinstance(ret, ast.Constant) and ret.value is None:
                  return "None"
              if isinstance(ret, ast.Attribute):
                  return ret.attr
              return "other"

          # ---------- 0. pytest ----------
          add("Запуск pytest",
              "OK" if TESTS_OK else "FAIL",
              "все тесты прошли" if TESTS_OK else "есть падающие тесты (см. лог)")

          # ---------- 1. Позитивные / негативные ----------
          positive = [t.name for t in test_functions if is_positive(t)]
          negative = [t.name for t in test_functions if is_negative(t)]

          add("Позитивные тесты",
              "OK" if positive else "FAIL",
              f"{len(positive)} тестов" if positive else "нет позитивных тестов")

          add("Негативные тесты (raises/warns/fail)",
              "OK" if negative else "FAIL",
              f"{len(negative)} тестов" if negative else
              f"нет ни одного из: {sorted(RAISES_STYLES)}")

          # ---------- 2. Проверки типов ----------
          has_isinstance = any(has_type_check(n) for n in ast.walk(
              ast.Module(body=[], type_ignores=[])) ) # placeholder
          has_type_in_tests = any(
              has_type_check(sub)
              for tf in TEST_FILES
              for tree in [test_trees[tf]]
              for sub in ast.walk(tree)
          )
          add("Проверки типов",
              "OK" if has_type_in_tests else "FAIL",
              f"стили: {sorted(TYPE_CHECK_STYLES)}" if has_type_in_tests
              else f"не найдено ни одного из: {sorted(TYPE_CHECK_STYLES)}")

          # ---------- 3. Негативные тесты на типы ----------
          found_type_errors = set()
          for node in test_functions:
              found_type_errors |= (raises_targets(node) & TYPE_EXCEPTIONS)
          add("Негативные тесты на неверные типы",
              "OK" if found_type_errors else "FAIL",
              f"проверяются: {sorted(found_type_errors)}" if found_type_errors
              else f"не найдено raises({sorted(TYPE_EXCEPTIONS)})")

          # ---------- 4. Функции с raise -> есть тест на исключение ----------
          functions_with_raise = []
          for n in all_fn_nodes:
              raises_any = any(isinstance(s, ast.Raise) for s in ast.walk(n))
              asserts_any = any(isinstance(s, ast.Assert) for s in ast.walk(n))
              if raises_any or asserts_any:
                  functions_with_raise.append(n.name)

          tested = set()
          for node in test_functions:
              if not has_raises(node):
                  continue
              for sub in ast.walk(node):
                  if isinstance(sub, ast.Call):
                      name = _get_callable_name(sub.func)
                      if name in functions_with_raise:
                          tested.add(name)

          not_tested = [f for f in functions_with_raise if f not in tested]
          add("Тесты на исключения для функций с raise/assert",
              "OK" if not not_tested else "FAIL",
              "" if not not_tested else f"не покрыты: {not_tested}")

          # ---------- 5. Сценарии по функциям ----------
          per_fn = {name: {"positive": 0, "negative": 0, "types": 0, "msg": 0} for name in fn_names}
          for node in test_functions:
              called = set()
              for sub in ast.walk(node):
                  if isinstance(sub, ast.Call):
                      name = _get_callable_name(sub.func)
                      if name in fn_names:
                          called.add(name)
              if is_negative(node):
                  for name in called:
                      per_fn[name]["negative"] += 1
                      if raises_checks_message(node):
                          per_fn[name]["msg"] += 1
              if is_positive(node):
                  for name in called:
                      per_fn[name]["positive"] += 1
              if has_type_check(node):
                  for name in called:
                      per_fn[name]["types"] += 1

          # требуем проверку типа возврата у всех аннотированных функций
          annotated_fns = {n.name for n in all_fn_nodes if annotated_return_kind(n) is not None}

          scenario_problems = []
          for name, st in per_fn.items():
              if st["positive"] == 0:
                  scenario_problems.append(f"{name}: нет позитивных тестов")
              if name in functions_with_raise and st["negative"] < MIN_NEGATIVE_TESTS:
                  scenario_problems.append(
                      f"{name}: нужно >= {MIN_NEGATIVE_TESTS} негативных, есть {st['negative']}")
              if name in annotated_fns and st["types"] == 0:
                  scenario_problems.append(f"{name}: нет проверки типа возврата")

          add("Сценарии по функциям",
              "OK" if not scenario_problems else "FAIL",
              "; ".join(scenario_problems))

          # ---------- 6. Минимум тестов ----------
          min_required = len(fn_names) * MIN_TESTS_PER_FN
          add("Минимальное количество тестов",
              "OK" if len(test_functions) >= min_required else "FAIL",
              f"{len(test_functions)} тестов (требуется >= {min_required} = "
              f"{len(fn_names)} функций × {MIN_TESTS_PER_FN})")

          # ---------- 7. Граничные значения ----------
          boundary_variants = {
              "ноль": [r"\b0\b", r"\b0\.0\b"],
              "отрицательные": [r"-\d+", r"\bnegative\b"],
              "пустые строки": [r'""', r"''", r"str\(\s*\)"],
              "None": [r"\bNone\b", r"\bnull\b"],
              "большие числа": [r"\b10\s*\*\*\s*\d", r"\b\d{4,}\b", r"\bMAX", r"\bINF"],
              "дробные": [r"\d+\.\d+"],
              "юникод": [r"[^\x00-\x7F]"],
          }
          covered_categories = [
              cat for cat, patterns in boundary_variants.items()
              if any(re.search(p, test_source_text) for p in patterns)
          ]
          missing_categories = [
              cat for cat in boundary_variants if cat not in covered_categories
          ]
          if len(covered_categories) >= MIN_BOUNDARY_CATEGORIES:
              add("Граничные значения",
                  "OK",
                  f"категории: {covered_categories}")
              if missing_categories:
                  warnings.append(f"не покрыты категории: {missing_categories}")
          else:
              add("Граничные значения",
                  "FAIL",
                  f"покрыто {len(covered_categories)} из {MIN_BOUNDARY_CATEGORIES} категорий; "
                  f"есть: {covered_categories}, нет: {missing_categories}")

          # ---------- 8. format_receipt: несколько способов проверки ----------
          if "format_receipt" in fn_names:
              receipt_checks = {
                  "regex": "re." in test_source_text or "import re" in test_source_text,
                  "substring": any(s in test_source_text for s in
                                   ('"Напиток:"', "'Напиток:'", '"Итого:"', "'Итого:'", '"Чек"', "'Чек'")),
                  "snapshot": "==" in test_source_text and "format_receipt(" in test_source_text,
                  "parametrize": "parametrize" in test_source_text,
              }
              found = [k for k, v in receipt_checks.items() if v]
              if len(found) >= 2:
                  add("Проверка формата чека", "OK", f"способы: {found}")
              elif len(found) == 1:
                  add("Проверка формата чека", "WARN", f"только: {found}")
              else:
                  add("Проверка формата чека", "FAIL",
                      f"ни один из {sorted(RECEIPT_CHECK_STYLES)} не используется")

          # ---------- 9. Проверка текста исключений ----------
          msg_tests = [t.name for t in test_functions if raises_checks_message(t)]
          if negative:
              if msg_tests:
                  add("Проверка текста исключений (match/regex)",
                      "OK", f"{len(msg_tests)} тестов")
              else:
                  warnings.append("ни один негативный тест не проверяет текст исключения")

          # ---------- 10. Маркеры ----------
          if REQUIRED_MARKERS:
              missing_markers = []
              for marker in REQUIRED_MARKERS:
                  count = sum(1 for t in test_functions if has_marker(t, marker))
                  if count == 0:
                      missing_markers.append(marker)
                  else:
                      add(f"Маркер @{marker}", "OK", f"{count} тестов")
              if missing_markers:
                  add("Обязательные маркеры",
                      "FAIL",
                      f"не найдены маркеры: {missing_markers}")

          # ---------- 11. Покрытие ----------
          try:
              with open("coverage.json") as f:
                  cov = json.load(f)
              executed_by_file = {}
              missing_by_file = {}
              for file_path, data in cov["files"].items():
                  executed_by_file[file_path] = set(data["executed_lines"])
                  missing_by_file[file_path] = set(data["missing_lines"])

              uncovered_fns = []
              for n in all_fn_nodes:
                  sf = n._source_file
                  executed = executed_by_file.get(sf, set())
                  fn_lines = set(range(n.lineno, n.end_lineno + 1))
                  if not (fn_lines & executed):
                      uncovered_fns.append(n.name)

              add("Покрытие функций тестами",
                  "OK" if not uncovered_fns else "FAIL",
                  "" if not uncovered_fns else f"не покрыты: {uncovered_fns}")

              total_missing = []
              for fp, lines in missing_by_file.items():
                  for line in sorted(lines):
                      total_missing.append(f"{Path(fp).name}:{line}")
              if total_missing:
                  add("Покрытие строк (все ветки)",
                      "FAIL",
                      f"непокрытые строки: {total_missing}")
              else:
                  add("Покрытие строк (все ветки)", "OK", "100% строк покрыто")
          except FileNotFoundError:
              add("Покрытие функций тестами", "WARN", "coverage.json не найден")

          # ---------- Печать отчёта ----------
          print()
          print("=" * 72)
          print(" ОТЧЁТ О ПРОВЕРКЕ ТЕСТОВ")
          print("=" * 72)
          print(f"  Настройки: MIN_TESTS_PER_FN={MIN_TESTS_PER_FN}, "
                f"MIN_NEGATIVE_TESTS={MIN_NEGATIVE_TESTS}, "
                f"MIN_BOUNDARY_CATEGORIES={MIN_BOUNDARY_CATEGORIES}, "
                f"STRICT={STRICT}, REQUIRED_MARKERS={REQUIRED_MARKERS}")
          print("-" * 72)
          for section, status, details in report:
              line = f"  [{status:4}] {section}"
              if details:
                  line += f" — {details}"
              print(line)
          print("=" * 72)
          if problems:
              print(f"РЕЗУЛЬТАТ: FAIL — проблем: {len(problems)}")
              for p in problems:
                  print(f"  ✗ {p}")
          else:
              print("РЕЗУЛЬТАТ: OK — все проверки пройдены")
          if warnings:
              print(f"ПРЕДУПРЕЖДЕНИЯ ({len(warnings)}):")
              for w in warnings:
                  print(f"  ! {w}")
          print("=" * 72)

          # ---------- GITHUB_OUTPUT ----------
          report_text = "\\n".join(
              f"[{status}] {section}" + (f" — {details}" if details else "")
              for section, status, details in report
          )
          ok = not problems
          if STRICT and warnings:
              ok = False
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"ok={'true' if ok else 'false'}\n")
              f.write("text<<REPORT_EOF\n")
              f.write(report_text + "\n")
              f.write("REPORT_EOF\n")
          EOF
        env:
          TESTS_OK: ${{ steps.pytest.outputs.tests_ok }}
          TEST_FILES: ${{ steps.locate_test.outputs.test_files }}
          SOURCE_FILES: ${{ steps.locate_source.outputs.source_files }}

  fail-if-report-not-ok:
    needs: analyze-tests
    runs-on: ubuntu-latest
    if: needs.analyze-tests.outputs.report_ok != 'true'
    steps:
      - name: Show report and fail
        run: |
          echo "Отчёт анализа тестов:"
          echo "--------------------------------------------------------------"
          echo -e "${{ needs.analyze-tests.outputs.report_text }}"
          echo "--------------------------------------------------------------"
          echo "::error::Анализ тестов не пройден — см. отчёт выше"
          exit 1

  success:
    needs: analyze-tests
    runs-on: ubuntu-latest
    if: needs.analyze-tests.outputs.report_ok == 'true'
    steps:
      - name: Confirm success
        run: |
          echo "Отчёт анализа тестов:"
          echo "--------------------------------------------------------------"
          echo -e "${{ needs.analyze-tests.outputs.report_text }}"
          echo "--------------------------------------------------------------"
          echo "Все проверки пройдены"