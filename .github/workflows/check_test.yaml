name: CI - Tests on Tag

on:
  push:
    tags:
      - '*'  # триггер на любой тег

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov coverage

      - name: Run tests with coverage
        run: |
          coverage run --branch -m pytest test_coffe.py -v
          coverage report -m
          coverage json -o coverage.json

      - name: Verify test coverage for all functions
        run: |
          echo "Проверка, что все функции покрыты тестами..."
          python - <<'EOF'
          import ast
          import sys
          import json
          from pathlib import Path

          candidates = [
              p for p in Path(".").glob("*.py")
              if p.name != "test_coffe.py" and not p.name.startswith("test_")
          ]
          if not candidates:
              print("Не найден исходный файл с кодом")
              sys.exit(1)
          source_file = candidates[0]
          print(f"Исходный файл: {source_file}")

          tree = ast.parse(source_file.read_text(encoding="utf-8"))
          functions = [n.name for n in ast.walk(tree) if isinstance(n, ast.FunctionDef)]
          print(f"Найдены функции: {functions}")

          with open("coverage.json") as f:
              cov = json.load(f)

          executed_lines = set()
          missing_lines = set()
          for file_path, data in cov["files"].items():
              if file_path.endswith(source_file.name):
                  executed_lines = set(data["executed_lines"])
                  missing_lines = set(data["missing_lines"])

          missing_functions = []
          for node in ast.walk(tree):
              if isinstance(node, ast.FunctionDef):
                  func_lines = set(range(node.lineno, node.end_lineno + 1))
                  if not (func_lines & executed_lines):
                      missing_functions.append(node.name)

          if missing_functions:
              print("НЕ ПОКРЫТЫ ТЕСТАМИ ФУНКЦИИ:")
              for m in missing_functions:
                  print(f"  - {m}")
              sys.exit(1)
          print("Все функции покрыты тестами")

          if missing_lines:
              print("НЕПОКРЫТЫЕ СТРОКИ (не все ветки протестированы):")
              for line in sorted(missing_lines):
                  print(f"  строка {line}")
              sys.exit(1)
          print("100% строк покрыто — все ветки проверены")
          EOF

      - name: Verify positive and negative tests exist
        run: |
          echo "Проверка наличия позитивных и негативных тестов, проверок типов и исключений..."
          python - <<'EOF'
          import ast
          import sys
          import re
          from pathlib import Path

          test_file = Path("test_coffe.py")
          if not test_file.exists():
              print("Файл с тестами test_coffe.py не найден")
              sys.exit(1)

          source_text = test_file.read_text(encoding="utf-8")
          tree = ast.parse(source_text)

          test_functions = [
              n for n in ast.walk(tree)
              if isinstance(n, ast.FunctionDef) and n.name.startswith("test_")
          ]
          print(f"Найдено тестовых функций: {len(test_functions)}")
          if not test_functions:
              print("ОШИБКА: нет тестовых функций")
              sys.exit(1)

          # ---------- 1. Наличие позитивных и негативных тестов ----------
          def has_raises(node):
              return any(
                  isinstance(sub, ast.Call)
                  and isinstance(sub.func, ast.Attribute)
                  and sub.func.attr == "raises"
                  for sub in ast.walk(node)
              )

          positive = [t.name for t in test_functions if not has_raises(t)]
          negative = [t.name for t in test_functions if has_raises(t)]

          if not positive:
              print("ОШИБКА: нет позитивных тестов (без pytest.raises)")
              sys.exit(1)
          if not negative:
              print("ОШИБКА: нет негативных тестов (pytest.raises)")
              sys.exit(1)
          print(f"Позитивных тестов: {len(positive)}, негативных: {len(negative)}")

          # ---------- 2. Проверки типов (isinstance) ----------
          has_isinstance = any(
              isinstance(n, ast.Call)
              and isinstance(n.func, ast.Name)
              and n.func.id == "isinstance"
              for n in ast.walk(tree)
          )
          if not has_isinstance:
              print("ОШИБКА: нет проверок типов данных (isinstance)")
              sys.exit(1)
          print("Проверки типов (isinstance) найдены")

          # ---------- 3. Негативные тесты на неверные типы ----------
          type_errors = {"TypeError", "ValueError"}
          has_type_or_value_error = False
          for node in ast.walk(tree):
              if isinstance(node, ast.Call):
                  f = node.func
                  if isinstance(f, ast.Attribute) and f.attr == "raises":
                      for arg in node.args:
                          if isinstance(arg, ast.Name) and arg.id in type_errors:
                              has_type_or_value_error = True
                              break
                  if has_type_or_value_error:
                      break
          if not has_type_or_value_error:
              print("ОШИБКА: нет негативных тестов на типы (pytest.raises(TypeError|ValueError))")
              sys.exit(1)
          print("Негативные тесты на типы найдены")

          # ---------- 4. Для каждой функции с raise есть тест на исключение ----------
          source_candidates = [
              p for p in Path(".").glob("*.py")
              if p.name != "test_coffe.py" and not p.name.startswith("test_")
          ]
          source_file = source_candidates[0]
          src_tree = ast.parse(source_file.read_text(encoding="utf-8"))

          functions_with_raise = []
          for node in ast.walk(src_tree):
              if isinstance(node, ast.FunctionDef):
                  for sub in ast.walk(node):
                      if isinstance(sub, ast.Raise):
                          functions_with_raise.append(node.name)
                          break
          print(f"Функции с raise: {functions_with_raise}")

          tested = set()
          for node in test_functions:
              if not has_raises(node):
                  continue
              for sub in ast.walk(node):
                  if isinstance(sub, ast.Call):
                      f = sub.func
                      name = None
                      if isinstance(f, ast.Name):
                          name = f.id
                      elif isinstance(f, ast.Attribute):
                          name = f.attr
                      if name in functions_with_raise:
                          tested.add(name)

          not_tested = [f for f in functions_with_raise if f not in tested]
          if not_tested:
              print("ОШИБКА: для функций с raise нет тестов на исключения:")
              for f in not_tested:
                  print(f"  - {f}")
              sys.exit(1)
          print("Для всех функций с raise есть тесты на исключения")

          # ---------- 5. Проверка сценариев по каждой функции ----------
          # Для каждой функции требуем: >=2 позитивных и >=1 негативный тест,
          # либо (если функция не бросает исключений) — >=1 позитивный и граничный тест
          fn_names = [n.name for n in ast.walk(src_tree) if isinstance(n, ast.FunctionDef)]

          # группируем тесты по вызываемым функциям
          per_fn_tests = {name: {"positive": 0, "negative": 0, "types": 0} for name in fn_names}
          for node in test_functions:
              neg = has_raises(node)
              called = set()
              for sub in ast.walk(node):
                  if isinstance(sub, ast.Call):
                      f = sub.func
                      name = f.id if isinstance(f, ast.Name) else (f.attr if isinstance(f, ast.Attribute) else None)
                      if name in fn_names:
                          called.add(name)
              for name in called:
                  if neg:
                      per_fn_tests[name]["negative"] += 1
                  else:
                      per_fn_tests[name]["positive"] += 1
              # проверки типов внутри тестов
              if any(isinstance(s, ast.Call) and isinstance(s.func, ast.Name) and s.func.id == "isinstance"
                     for s in ast.walk(node)):
                  for name in called:
                      per_fn_tests[name]["types"] += 1

          print("Сценарии по функциям:", per_fn_tests)

          problems = []
          for name, stats in per_fn_tests.items():
              # у каждой функции должен быть хотя бы один позитивный тест
              if stats["positive"] == 0:
                  problems.append(f"{name}: нет позитивных тестов")
              # если функция бросает исключения — нужен негативный
              if name in functions_with_raise and stats["negative"] == 0:
                  problems.append(f"{name}: нет негативного теста (функция бросает исключения)")
              # для функций с возвратом составного типа — нужна проверка типа
              if name in ("get_most_expensive_drink", "generate_wifi_password") and stats["types"] == 0:
                  problems.append(f"{name}: нет проверки типа возврата (isinstance)")

          # хотя бы одна проверка типов в целом по критичным функциям
          critical_type_funcs = {"get_most_expensive_drink", "generate_wifi_password"}
          for ctf in critical_type_funcs:
              if ctf in per_fn_tests and per_fn_tests[ctf]["types"] == 0 and not any(
                  ctf in p for p in problems
              ):
                  # не дублируем, если уже добавили
                  pass

          if problems:
              print("ОШИБКА: не все сценарии покрыты:")
              for p in problems:
                  print(f"  - {p}")
              sys.exit(1)
          print("Все сценарии по функциям покрыты (позитив/негатив/типы)")

          # ---------- 6. Минимум по общему числу тестов (эвристика на "все возможные сценарии") ----------
          # Для 5+ функций ожидаем >= 15 тестов (по ~3 на функцию: позитив/граница/негатив)
          if len(fn_names) >= 4 and len(test_functions) < len(fn_names) * 3:
              print(f"ОШИБКА: слишком мало тестов ({len(test_functions)}) для {len(fn_names)} функций — ожидается >= {len(fn_names)*3}")
              sys.exit(1)

          # ---------- 7. Проверка наличия граничных значений (0, отрицательные, пустые) ----------
          # ищем в тестах литералы 0, -1, "", None
          has_zero = re.search(r"\b0\b", source_text) is not None
          has_negative = re.search(r"-\d", source_text) is not None
          has_empty_str = '""' in source_text or "''" in source_text
          has_none = "None" in source_text

          if not has_zero:
              print("ОШИБКА: нет граничных тестов с нулём")
              sys.exit(1)
          if not has_negative:
              print("ОШИБКА: нет негативных тестов с отрицательными значениями")
              sys.exit(1)
          if not has_empty_str:
              print("ОШИБКА: нет тестов с пустыми строками")
              sys.exit(1)
          if not has_none:
              print("ОШИБКА: нет тестов с None")
              sys.exit(1)
          print("Граничные значения (0, отрицательные, пустые строки, None) присутствуют в тестах")

          # ---------- 8. Проверка регулярных выражений (для формата чека) ----------
          if "format_receipt" in fn_names:
              if "re." not in source_text and "import re" not in source_text:
                  print("ПРЕДУПРЕЖДЕНИЕ: для format_receipt не найдено проверок через регулярные выражения")

          print("Все структурные проверки тестов пройдены")
          EOF